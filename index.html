<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalog</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
      letter-spacing: 0.02em;
    }

    .guide {
      padding: 16px 16px;
      margin: 0 0 18px;
      border-radius: 14px;
      background: #eef3f7;
      border-left: 5px solid #7b8fa3;
      color: #344150;
      font-size: 14px;
      line-height: 1.8;
      box-shadow: none;
    }

    .guide strong {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      color: #26313d;
    }

    .guide p {
      margin: 0;
    }

    .typewriter-cursor::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: 1.1em;
      margin-left: 2px;
      background: #344150;
      vertical-align: -0.15em;
      animation: blink 0.9s step-end infinite;
    }

    .choice-main {
      display: block;
      font-size: 15px;
      letter-spacing: 0.02em;
    }

    .choice-kana {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      color: #7a8794;
      font-weight: 500;
      letter-spacing: 0.08em;
      transition: color 0.14s ease-out;
    }

    .typewriter-done::after {
      display: none;
    }

    a {
      display: block;
      padding: 18px 16px;
      margin: 12px 0;
      border-radius: 14px;
      background: #fff;
      color: #222;
      text-decoration: none;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      font-weight: 700;
    }

    .choice {
      position: relative;
      overflow: hidden;
      transition:
        background 0.14s ease-out,
        color 0.14s ease-out,
        box-shadow 0.14s ease-out;
    }

    .choice::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(123,143,163,0.10), transparent 58%);
      opacity: 0;
      transition: opacity 0.14s ease-out;
      pointer-events: none;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
      line-height: 1.7;
    }

    .js-animate,
    .post-type {
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 0.9s ease-out,
        transform 0.9s ease-out;
    }

    .js-animate.is-visible,
    .post-type.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .post-type.choice.is-visible {
      transition:
        opacity 0.9s ease-out,
        transform 0.9s ease-out,
        background 0.14s ease-out,
        color 0.14s ease-out,
        box-shadow 0.14s ease-out;
    }

    @media (hover: hover) and (pointer: fine) {
      .post-type.choice.is-visible:hover {
        background: #fbfdff;
        color: #26313d;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
      }

      .post-type.choice.is-visible:hover::after {
        opacity: 1;
      }

      .post-type.choice.is-visible:hover .choice-kana {
        color: #5f7182;
      }
    }

    .choice:active {
      transform: scale(0.98);
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .js-animate,
      .post-type,
      .post-type.choice.is-visible {
        opacity: 1;
        transform: none;
        transition: none;
      }

      .choice,
      .choice::after,
      .choice-kana {
        transition: none;
      }

      .typewriter-cursor::after {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Catalog</h1>

    <div class="guide js-animate" data-delay="500">
      <strong>見てほしいポイント</strong>
      <p
        id="typewriter"
        class="typewriter-cursor"
        data-text="還暦祝いに、父に合いそうな腕時計をいくつか選んでみました。まずは、A/B/Cの中で「これが近いかな」と思うものを選んでみてください。そのうえで、色や細かいデザインの好みも聞かせてもらえると嬉しいです。"
      ></p>
    </div>

    <a class="choice post-type" data-after-type="1300" href="./Presage.html">
      <span class="choice-main">A. Presage</span>
      <span class="choice-kana">プレザージュ</span>
    </a>

    <a class="choice post-type" data-after-type="2300" href="./Prospex.html">
      <span class="choice-main">B. Prospex</span>
      <span class="choice-kana">プロスペックス</span>
    </a>

    <a class="choice post-type" data-after-type="3300" href="./OCEANUS.html">
      <span class="choice-main">C. OCEANUS</span>
      <span class="choice-kana">オシアナス</span>
    </a>

    <div class="note post-type" data-after-type="5300">
      各候補の詳細ページを開けます。
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const skipAnimation = params.get('skipAnimation') === '1';

      const animatedItems = document.querySelectorAll('.js-animate');
      const target = document.getElementById('typewriter');
      const text = target.dataset.text || '';
      const postTypeItems = document.querySelectorAll('.post-type');
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function showPostTypeItems() {
        postTypeItems.forEach(function (item) {
          const delay = Number(item.dataset.afterType || 0);

          setTimeout(function () {
            item.classList.add('is-visible');
          }, delay);
        });
      }

      function showAllImmediately() {
        target.textContent = text;
        target.classList.add('typewriter-done');

        animatedItems.forEach(function (item) {
          item.classList.add('is-visible');
        });

        postTypeItems.forEach(function (item) {
          item.classList.add('is-visible');
        });
      }

      if (skipAnimation || prefersReducedMotion) {
        showAllImmediately();
        return;
      }

      animatedItems.forEach(function (item) {
        const delay = Number(item.dataset.delay || 0);

        setTimeout(function () {
          item.classList.add('is-visible');
        }, delay);
      });

      let index = 0;
      const typingSpeed = 80;
      const startDelay = 1200;

      function typeText() {
        if (index < text.length) {
          target.textContent += text.charAt(index);
          index++;
          setTimeout(typeText, typingSpeed);
        } else {
          target.classList.add('typewriter-done');
          showPostTypeItems();
        }
      }

      setTimeout(typeText, startDelay);
    });
  </script>
</body>
</html>
